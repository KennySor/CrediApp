name: crediapp
description: "CrediAPP - gestión de préstamos y cobros."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  adaptive_icon_background: "#126F81"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"